
name: gerenciar_mudanca

services:
  postgres:
    image: postgres:18
    container_name: gerenciamento-mudanca-db
    restart: unless-stopped
  
    environment:
      POSTGRES_DB: gerenciamento_mudanca
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports: 
      - "127.0.0.1:5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d gerenciamento_mudancas"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: gerenciamento-mudancas-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    
    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data: